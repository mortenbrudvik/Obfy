name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Test with Coverage
      run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Generate Coverage Report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator "-reports:coverage/**/coverage.cobertura.xml" "-targetdir:coverage/report" "-reporttypes:Cobertura;HtmlInline;MarkdownSummaryGithub;Badges"

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/report

    - name: Add Coverage PR Comment
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        recreate: true
        path: coverage/report/SummaryGithub.md

    - name: Add Coverage to Summary
      run: cat coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
      shell: bash

    - name: Check Coverage Threshold
      shell: pwsh
      run: |
        [xml]$cobertura = Get-Content coverage/report/Cobertura.xml
        $rate = [double]$cobertura.coverage.'line-rate'
        $pct = [math]::Round($rate * 100, 2)
        Write-Host "Coverage: $pct%"
        if ($pct -lt 80) {
          Write-Host "::warning::Coverage $pct% is below 80% threshold"
        }
