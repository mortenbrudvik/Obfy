name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    # Naming any permission zeros the rest; checkout needs contents: read.
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        # 8.0.106 is the SDK that ships host pack 8.0.6 (used by NativeHost/build.ps1).
        # 8.0.6 is a runtime, not an SDK; setup-dotnet 404s on it.
        dotnet-version: |
          10.0.x
          8.0.106

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

    - name: Build native packer host
      shell: pwsh
      run: pwsh -File Src/Obfy.NativeHost/build.ps1

    - name: Upload rebuilt native host
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: native-host
        path: Src/Obfy.NativeHost/dist/Obfy.NativeHost.exe

    # MSVC versions rewrite the exe without a source change (windows-2025-vs2026 is 14.51).
    # Fail when host.c, build.ps1, or PackedBootstrap disagree with the committed
    # stamp. build.ps1 rewrites the working-tree stamp, so the check reads HEAD.
    # A compiler-only byte diff stays a warning. Tests still use the rebuild.
    - name: Native host sources match the committed stamp
      shell: pwsh
      run: |
        ./build/Test-NativeHostSourceStamp.ps1 -FromGitHead
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git diff --exit-code -- Src/Obfy.NativeHost/dist/Obfy.NativeHost.exe
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::warning::Rebuilt Obfy.NativeHost.exe differs from the checked-in binary, and the source stamp still matches. This is compiler output, not a source change. Download the native-host artifact and commit the exe to refresh the checked-in stub."
        }
        exit 0

    # Node must be on PATH before "Build": Obfy.UI.csproj runs npm (ci + run build) for the web app, which the Release
    # exe serves. Lint and the web tests run here too, so a broken page fails before the .NET build starts.
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: Src/WebApp/package-lock.json

    - name: Web app install
      working-directory: Src/WebApp
      run: npm ci

    - name: Web app lint
      working-directory: Src/WebApp
      run: npm run lint

    - name: Web app tests
      working-directory: Src/WebApp
      run: npm run test:run

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Test with Coverage
      run: dotnet test --no-build -c Release --filter "Category!=UI&Category!=Platform" --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Pack .NET tool
      run: dotnet pack Src/Obfy.Console/Obfy.Console.csproj --no-build -c Release -o ./artifacts

    - name: Upload NuGet package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg

    - name: Generate Coverage Report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator "-reports:coverage/**/coverage.cobertura.xml" "-targetdir:coverage/report" "-reporttypes:Cobertura;HtmlInline;MarkdownSummaryGithub;Badges"

    - name: Upload Coverage Report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report
        path: coverage/report

    # Same-repo PRs only. Fork pull_request tokens stay read-only even when this
    # job requests write — skip them instead of 403. continue-on-error is a
    # backstop for Dependabot and other read-only tokens so a comment failure
    # cannot skip the summary or 80% warning.
    - name: Add Coverage PR Comment
      id: coverage_comment
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
      with:
        recreate: true
        path: coverage/report/SummaryGithub.md

    - name: Warn if coverage comment failed
      if: github.event_name == 'pull_request' && steps.coverage_comment.outcome == 'failure'
      run: echo "::warning::Coverage PR comment failed (expected on read-only GITHUB_TOKEN). Job summary and 80% warning still run. See 'Add Coverage PR Comment' logs."

    - name: Add Coverage to Summary
      if: success() || failure()
      run: |
        if [ -f coverage/report/SummaryGithub.md ]; then
          cat coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
        else
          echo "::warning::Coverage summary missing; tests or report generation likely failed."
        fi
      shell: bash

    - name: Check Coverage Threshold
      if: success() || failure()
      shell: pwsh
      run: |
        $coberturaPath = "coverage/report/Cobertura.xml"
        if (-not (Test-Path $coberturaPath)) {
          Write-Host "::error::Cobertura.xml missing; coverage threshold was not evaluated"
          exit 1
        }
        [xml]$cobertura = Get-Content $coberturaPath
        $rate = [double]$cobertura.coverage.'line-rate'
        $pct = [math]::Round($rate * 100, 2)
        Write-Host "Coverage: $pct%"
        if ($pct -lt 80) {
          Write-Host "::warning::Coverage $pct% is below 80% threshold (warning only; not a hard fail)"
        }

    # windows-latest has an interactive session. Default dotnet test still
    # excludes Category=UI; this step is the opt-in run against the Release exe.
    # The web UI tests drive the WebView2 page with Playwright over a remote-debugging port (CDP), so they need no
    # Playwright browser download; the WebView2 runtime ships with windows-latest.
    - name: UI tests
      shell: pwsh
      run: |
        # ilammy/msvc-dev-cmd exports Platform=x64 for the rest of the job. The solution build ignores it, but a
        # project-level `dotnet test --no-build` then looks in bin\x64\Release and finds no DLL, so no test ran.
        Remove-Item Env:Platform -ErrorAction SilentlyContinue
        dotnet test Tests/Obfy.UI.AutomationTests/Obfy.UI.AutomationTests.csproj --no-build -c Release --filter "Category=UI" --nologo
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    - name: Test CLI on Linux
      run: dotnet test Tests/Obfy.Console.Tests/Obfy.Console.Tests.csproj -c Release --nologo
