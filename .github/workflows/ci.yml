name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    # Naming any permission zeros the rest; checkout needs contents: read.
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Test with Coverage
      run: dotnet test --no-build -c Release --filter "Category!=UI&Category!=Platform" --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Generate Coverage Report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator "-reports:coverage/**/coverage.cobertura.xml" "-targetdir:coverage/report" "-reporttypes:Cobertura;HtmlInline;MarkdownSummaryGithub;Badges"

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/report

    # Same-repo PRs only. Fork pull_request tokens stay read-only even when this
    # job requests write — skip them instead of 403. continue-on-error is a
    # backstop for Dependabot and other read-only tokens so a comment failure
    # cannot skip the summary or 80% warning.
    - name: Add Coverage PR Comment
      id: coverage_comment
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        recreate: true
        path: coverage/report/SummaryGithub.md

    - name: Warn if coverage comment failed
      if: github.event_name == 'pull_request' && steps.coverage_comment.outcome == 'failure'
      run: echo "::warning::Coverage PR comment failed (expected on read-only GITHUB_TOKEN). Job summary and 80% warning still run. See 'Add Coverage PR Comment' logs."

    - name: Add Coverage to Summary
      if: success() || failure()
      run: |
        if [ -f coverage/report/SummaryGithub.md ]; then
          cat coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
        else
          echo "::warning::Coverage summary missing; tests or report generation likely failed."
        fi
      shell: bash

    - name: Check Coverage Threshold
      if: success() || failure()
      shell: pwsh
      run: |
        $coberturaPath = "coverage/report/Cobertura.xml"
        if (-not (Test-Path $coberturaPath)) {
          Write-Host "::error::Cobertura.xml missing; coverage threshold was not evaluated"
          exit 1
        }
        [xml]$cobertura = Get-Content $coberturaPath
        $rate = [double]$cobertura.coverage.'line-rate'
        $pct = [math]::Round($rate * 100, 2)
        Write-Host "Coverage: $pct%"
        if ($pct -lt 80) {
          Write-Host "::warning::Coverage $pct% is below 80% threshold (warning only; not a hard fail)"
        }

  rider-tests:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
        cache-dependency-path: Src/Obfy.Rider/gradle/wrapper/gradle-wrapper.properties

    - name: Rider JVM tests
      working-directory: Src/Obfy.Rider
      run: ./gradlew.bat test --no-daemon
