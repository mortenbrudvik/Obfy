name: Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    # Node must be on PATH before the packaging steps: both publish Obfy.UI, whose build runs npm (ci + run build) for the web app.
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: Src/WebApp/package-lock.json

    - name: Install Inno Setup 6
      run: choco install innosetup --no-progress -y

    - name: Build MSIX
      shell: pwsh
      run: |
        ./build/build-msix.ps1
        if ($LASTEXITCODE -ne 0) { throw "MSIX build failed ($LASTEXITCODE)" }
        $msix = Get-ChildItem ./build/msix-output -Filter *.msix
        if (-not $msix) { throw "MSIX output is missing" }

    - name: Build Inno installer
      shell: pwsh
      run: |
        ./build/build-installer.ps1
        if ($LASTEXITCODE -ne 0) { throw "Installer build failed ($LASTEXITCODE)" }
        $setup = Get-ChildItem ./build/output -Filter ObfySetup-*.exe
        if (-not $setup) { throw "Installer output is missing" }

    - name: Upload packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: packages
        path: |
          build/msix-output/*.msix
          build/output/ObfySetup-*.exe
