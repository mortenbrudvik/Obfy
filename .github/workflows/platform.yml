name: Platform

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  native-aot:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: "10.0.x"

    # Node must be on PATH before "Build": it builds Obfy.UI, whose project runs npm (ci + run build) for the web app.
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: Src/WebApp/package-lock.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: NativeAOT tests
      shell: pwsh
      run: |
        dotnet test --no-build -c Release --filter "Category=Platform&FullyQualifiedName~NativeAotTests" --nologo --results-directory ./artifacts/native-aot --logger trx
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./build/Assert-NoSkippedTests.ps1 -ResultsDirectory ./artifacts/native-aot

  platform:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: "10.0.x"

    - name: Install MAUI Windows workload
      run: dotnet workload install maui-windows

    # Node must be on PATH before "Build": it builds Obfy.UI, whose project runs npm (ci + run build) for the web app.
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: Src/WebApp/package-lock.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Platform tests
      shell: pwsh
      run: |
        dotnet test --no-build -c Release --filter "Category=Platform" --nologo --results-directory ./artifacts/platform --logger trx
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./build/Assert-NoSkippedTests.ps1 -ResultsDirectory ./artifacts/platform
