name: Platform

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  platform:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Install MAUI Windows workload
      continue-on-error: true
      run: dotnet workload install maui-windows

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Platform tests
      run: dotnet test --no-build -c Release --filter "Category=Platform" --nologo
      # Blazor WASM skips at discovery if the BlazorWebAssembly SDK is missing.
      # NativeAOT always runs. MAUI Windows runs when the workload install above succeeded.
