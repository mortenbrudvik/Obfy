name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Obfy.sln

    - name: Build
      run: dotnet build Obfy.sln --no-restore -c Release

    - name: Test
      run: >
        dotnet test Obfy.sln --no-build -c Release
        --filter "Category!=UI&Category!=Platform"
        --verbosity normal

    - name: Pack
      run: dotnet pack Src/Obfy.Console/Obfy.Console.csproj --no-build -c Release -o ./artifacts

    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: mortenbrudvik

    - name: Push to NuGet
      shell: pwsh
      run: >
        dotnet nuget push ./artifacts/*.nupkg
        --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
