name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (1.2.3 or v1.2.3)
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        # 8.0.106 ships host pack 8.0.6 (NativeHost/build.ps1). 8.0.6 is a runtime, not an SDK.
        dotnet-version: |
          10.0.x
          8.0.106

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

    # Obfy.Core embeds dist/Obfy.NativeHost.exe at build time. Rebuild before
    # dotnet build so the packed tool does not ship a stale checked-in stub.
    - name: Rebuild native packer host
      shell: pwsh
      run: |
        pwsh -File Src/Obfy.NativeHost/build.ps1
        if ($LASTEXITCODE -ne 0) { throw "Native host build failed ($LASTEXITCODE)" }

    # Node must be on PATH before the build: Obfy.UI.csproj runs npm (ci + run build) as part of building Obfy.sln.
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: Src/WebApp/package-lock.json

    - name: Resolve package version
      id: version
      shell: pwsh
      env:
        PACKAGE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      run: |
        $resolved = & ./build/Resolve-PackageVersion.ps1 -RefName $env:PACKAGE_REF
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resolved)) {
          throw "Could not resolve a package version from '$env:PACKAGE_REF'."
        }
        "version=$($resolved.Trim())" >> $env:GITHUB_OUTPUT

    - name: Restore
      run: dotnet restore Obfy.sln

    - name: Build
      run: dotnet build Obfy.sln --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

    - name: Test
      run: >
        dotnet test Obfy.sln --no-build -c Release
        --filter "Category!=UI&Category!=Platform"
        --verbosity normal

    - name: Pack
      run: dotnet pack Src/Obfy.Console/Obfy.Console.csproj --no-build -c Release -p:Version=${{ steps.version.outputs.version }} -o ./artifacts

    - name: NuGet login (OIDC)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: login
      with:
        user: mortenbrudvik

    - name: Push to NuGet
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $lower = $version.ToLowerInvariant()
        $url = "https://api.nuget.org/v3-flatcontainer/obfy/$lower/obfy.$lower.nupkg"
        $existing = Invoke-WebRequest -Uri $url -Method Head -SkipHttpErrorCheck
        if ($existing.StatusCode -eq 200) {
          throw "Obfy $version is already on NuGet. Refusing to report a successful publish."
        }
        if ($existing.StatusCode -ne 404) {
          throw "NuGet version check for Obfy $version returned HTTP $([int]$existing.StatusCode)."
        }

        $packages = Get-ChildItem ./artifacts -Filter *.nupkg
        if (-not $packages) { throw "No .nupkg in ./artifacts" }
        foreach ($pkg in $packages) {
          dotnet nuget push $pkg.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "nuget push failed for $($pkg.Name)" }
        }
