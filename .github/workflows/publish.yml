name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Test
      run: >
        dotnet test
        Tests/Obfy.Tests/Obfy.Tests.csproj
        Tests/Obfy.Console.Tests/Obfy.Console.Tests.csproj
        -c Release
        --filter "Category!=UI&Category!=Platform"
        --verbosity normal

    - name: Pack
      run: dotnet pack Src/Obfy.Console/Obfy.Console.csproj -c Release -o ./artifacts

    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
