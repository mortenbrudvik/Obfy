name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Obfy.sln

    - name: Build
      run: dotnet build Obfy.sln --no-restore -c Release

    - name: Test
      run: >
        dotnet test Obfy.sln --no-build -c Release
        --filter "Category!=UI&Category!=Platform"
        --verbosity normal

    - name: Pack
      run: dotnet pack Src/Obfy.Console/Obfy.Console.csproj --no-build -c Release -o ./artifacts

    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: mortenbrudvik

    - name: Push to NuGet
      shell: pwsh
      run: |
        $packages = Get-ChildItem ./artifacts -Filter *.nupkg
        if (-not $packages) { throw "No .nupkg in ./artifacts" }
        foreach ($pkg in $packages) {
          dotnet nuget push $pkg.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "nuget push failed for $($pkg.Name)" }
        }
