# TEMPORARY: reproduces the "UI tests" step of ci.yml without the 16-minute coverage run, and gathers evidence on why
# WebView2's remote-debugging port never opens on the runner. Delete before merging.
name: UI debug (temporary)

on:
  pull_request:
    paths: [ '.github/workflows/ui-debug.yml' ]
  workflow_dispatch:

jobs:
  ui:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      DIAG: ${{ github.workspace }}\ui-diag
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Runtime and desktop facts
      if: always()
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force $env:DIAG | Out-Null
        $out = Join-Path $env:DIAG 'environment.txt'
        $lines = & {
          Get-Date -Format o
          Get-CimInstance Win32_OperatingSystem | ForEach-Object { "OS: $($_.Caption) $($_.Version) build $($_.BuildNumber)" }
          "Session id: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)  UserInteractive: $([Environment]::UserInteractive)"
          "User: $env:USERNAME  Profile: $env:USERPROFILE  LOCALAPPDATA: $env:LOCALAPPDATA  TEMP: $env:TEMP"
          Add-Type -AssemblyName System.Windows.Forms
          $s = [System.Windows.Forms.SystemInformation]::VirtualScreen
          "Virtual screen: $($s.Width)x$($s.Height)"
          '--- WebView2 runtime registry ---'
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          foreach ($key in "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid", "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$guid") {
            if (Test-Path $key) { "$key => $((Get-ItemProperty $key).pv)" } else { "$key => (absent)" }
          }
          '--- Edge/WebView2 folders ---'
          foreach ($dir in 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application', 'C:\Program Files\Microsoft\EdgeWebView\Application', 'C:\Program Files (x86)\Microsoft\Edge\Application') {
            if (Test-Path $dir) { "$dir"; Get-ChildItem $dir | ForEach-Object { "  $($_.Name)" } } else { "$dir => (absent)" }
          }
          '--- msedgewebview2.exe files ---'
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Recurse -Filter msedgewebview2.exe -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName) $($_.VersionInfo.ProductVersion)" }
          '--- Running processes of interest ---'
          Get-Process | Where-Object { $_.Name -match 'Obfy|msedge|webview' } | Format-Table Id, Name, SessionId | Out-String
          '--- Environment variables of interest ---'
          Get-ChildItem Env: | Where-Object { $_.Name -match 'WEBVIEW|EDGE|CHROME|PLAYWRIGHT|OBFY|Platform' } | ForEach-Object { "$($_.Name)=$($_.Value)" }
        }
        $lines | Tee-Object $out

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: |
          10.0.x
          8.0.106

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: Src/WebApp/package-lock.json

    - name: Web app install
      working-directory: Src/WebApp
      run: npm ci

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Policies and CDP probes
      if: always()
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force $env:DIAG | Out-Null
        $out = Join-Path $env:DIAG 'probes.txt'
        function Get-Cdp([int]$port) {
          try { (Invoke-WebRequest "http://127.0.0.1:$port/json/version" -UseBasicParsing -TimeoutSec 2).Content } catch { $null }
        }
        function Wait-Cdp([int]$port, [int]$seconds) {
          for ($i = 0; $i -lt $seconds; $i++) { $r = Get-Cdp $port; if ($r) { return $r }; Start-Sleep -Seconds 1 }
          return $null
        }
        function Get-WebViewVersion {
          (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
        }
        $exe = Join-Path $env:GITHUB_WORKSPACE 'Src\Obfy.UI\bin\Release\net10.0-windows10.0.26100\ObfyUI.exe'
        function Invoke-ObfyProbe([string]$label, [int]$port, [string]$browserArgs) {
          $work = Join-Path $env:TEMP ("probe-obfy-" + $port)
          New-Item -ItemType Directory -Force $work | Out-Null
          $psi = New-Object System.Diagnostics.ProcessStartInfo $exe
          $psi.UseShellExecute = $false
          $psi.Environment['OBFY_UI_PREFERENCES'] = Join-Path $work 'ui-preferences.json'
          $psi.Environment['OBFY_WEBVIEW2_USER_DATA'] = Join-Path $work 'webview2'
          if ($browserArgs) { $psi.Environment['WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS'] = $browserArgs }
          $app = [System.Diagnostics.Process]::Start($psi)
          $r = Wait-Cdp $port 25
          "ObfyUI [$label]: $(if ($r) { 'PORT OPEN' } else { 'NO ANSWER' }); chrome_debug.log: $(Test-Path (Join-Path $work 'webview2\EBWebView\chrome_debug.log'))"
          $app.Kill($true)
          Start-Sleep -Seconds 2
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        }
        $lines = & {
          "WebView2 runtime before: $(Get-WebViewVersion)"
          Invoke-ObfyProbe 'env var, runtime as imaged' 9341 '--remote-debugging-port=9341 --remote-allow-origins=* --enable-logging --v=1'

          # The same through the machine policy that WebView2 reads for every host app.
          $key = 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name '*' -Value '--remote-debugging-port=9342 --remote-allow-origins=* --enable-logging --v=1' -PropertyType String -Force | Out-Null
          Invoke-ObfyProbe 'registry policy AdditionalBrowserArguments, runtime as imaged' 9342 $null
          Remove-Item 'HKCU:\Software\Policies\Microsoft\Edge\WebView2' -Recurse -Force

          '--- Updating the WebView2 runtime with the Evergreen bootstrapper ---'
          $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          $install = Start-Process $setup -ArgumentList '/silent', '/install' -Wait -PassThru
          "bootstrapper exit code: $($install.ExitCode)"
          "WebView2 runtime after: $(Get-WebViewVersion)"
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' | ForEach-Object { "  $($_.Name)" }
          Invoke-ObfyProbe 'env var, after the update' 9343 '--remote-debugging-port=9343 --remote-allow-origins=* --enable-logging --v=1'
        }
        $lines | Tee-Object $out

    - name: Start sampler
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force $env:DIAG | Out-Null
        $sampler = @'
        param([string]$Diag)
        Add-Type -AssemblyName System.Windows.Forms, System.Drawing
        $log = Join-Path $Diag 'sampler.txt'
        $stop = Join-Path $Diag 'sampler.stop'
        for ($i = 0; $i -lt 90 -and -not (Test-Path $stop); $i++) {
          "=== $(Get-Date -Format 'HH:mm:ss') sample $i ===" | Out-File $log -Append
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match 'ObfyUI|msedgewebview2|testhost|dotnet' } |
            ForEach-Object { "{0,6} ppid {1,6} {2}  {3}" -f $_.ProcessId, $_.ParentProcessId, $_.Name, $_.CommandLine } | Out-File $log -Append
          '--- listening ports ---' | Out-File $log -Append
          netstat -ano | Select-String 'LISTENING' | Out-File $log -Append
          try {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $Diag ('screen-{0:000}.png' -f $i)), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          } catch { "screenshot failed: $_" | Out-File $log -Append }
          Start-Sleep -Seconds 8
        }
        '@
        Set-Content -Path (Join-Path $env:DIAG 'sampler.ps1') -Value $sampler
        Start-Process pwsh -ArgumentList '-NoProfile', '-File', (Join-Path $env:DIAG 'sampler.ps1'), '-Diag', $env:DIAG -WindowStyle Hidden

    - name: UI tests
      shell: pwsh
      env:
        OBFY_E2E_KEEP: '1'
        OBFY_E2E_WEBVIEW_LOG: '1'
      run: |
        Remove-Item Env:Platform -ErrorAction SilentlyContinue
        dotnet test Tests/Obfy.UI.AutomationTests/Obfy.UI.AutomationTests.csproj --no-build -c Release --filter "Category=UI&FullyQualifiedName~FirstLaunch" --nologo --logger "trx;LogFileName=ui.trx" --results-directory "$env:DIAG\results"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Collect evidence
      if: always()
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force $env:DIAG | Out-Null
        New-Item -ItemType File -Force (Join-Path $env:DIAG 'sampler.stop') | Out-Null
        # A last look at the desktop and the processes once the tests are over.
        Add-Type -AssemblyName System.Windows.Forms, System.Drawing
        $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
        $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
        $g = [System.Drawing.Graphics]::FromImage($bmp)
        $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
        $bmp.Save((Join-Path $env:DIAG 'screen-final.png'), [System.Drawing.Imaging.ImageFormat]::Png)

        # Application event log, errors and warnings of the last hour.
        try {
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2, 3; StartTime = (Get-Date).AddHours(-1) } -ErrorAction Stop |
            ForEach-Object { "{0:o} [{1}] {2} id={3}`n{4}`n" -f $_.TimeCreated, $_.LevelDisplayName, $_.ProviderName, $_.Id, ($_.Message -replace '\s+$','') } |
            Out-File (Join-Path $env:DIAG 'eventlog-application.txt')
        } catch { "no events: $_" | Out-File (Join-Path $env:DIAG 'eventlog-application.txt') }

        # The app's own logs.
        $logs = Join-Path $env:LOCALAPPDATA 'Obfy\Logs'
        if (Test-Path $logs) { Copy-Item $logs (Join-Path $env:DIAG 'obfy-logs') -Recurse -Force } else { "no $logs" | Out-File (Join-Path $env:DIAG 'obfy-logs.txt') }

        # The test launches' scratch folders (kept by OBFY_E2E_KEEP): logs and small state files, not browser caches.
        foreach ($dir in Get-ChildItem $env:TEMP -Directory -Filter 'obfy-e2e-*' -ErrorAction SilentlyContinue) {
          $target = Join-Path $env:DIAG ('scratch\' + $dir.Name)
          Get-ChildItem $dir.FullName -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -lt 20MB -and ($_.Name -match '\.log$|^LOG(\.old)?$|^Local State$|^ui-preferences\.json$|^Preferences$') } |
            ForEach-Object {
              $relative = $_.FullName.Substring($dir.FullName.Length).TrimStart('\')
              $destination = Join-Path $target $relative
              New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
              Copy-Item $_.FullName $destination -ErrorAction SilentlyContinue
            }
          # The shape of the profile folder, to see how far WebView2 got.
          Get-ChildItem (Join-Path $dir.FullName 'webview2') -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 400 -ExpandProperty FullName | Out-File (Join-Path $env:DIAG ("tree-" + $dir.Name + '.txt'))
        }

        netstat -ano | Out-File (Join-Path $env:DIAG 'netstat-final.txt')
        Get-Process | Sort-Object Name | Format-Table Id, Name, SessionId | Out-String | Out-File (Join-Path $env:DIAG 'processes-final.txt')

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ui-diag
        path: ui-diag
        if-no-files-found: warn
