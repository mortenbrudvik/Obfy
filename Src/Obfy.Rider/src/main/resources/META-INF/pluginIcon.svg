<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shield shape -->
  <path d="M20 3L5 8v10c0 9 6 16 15 19 9-3 15-10 15-19V8L20 3z"
        fill="url(#shieldGrad)"
        stroke="#1E3A5F"
        stroke-width="1"
        filter="url(#shadow)"/>
  <!-- Lock body -->
  <rect x="13" y="18" width="14" height="10" rx="1.5" fill="#FFFFFF" opacity="0.95"/>
  <!-- Lock shackle -->
  <path d="M15 18V14C15 11.2 17.2 9 20 9s5 2.2 5 5v4"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.95"/>
  <!-- Keyhole -->
  <circle cx="20" cy="23" r="2" fill="#2E5C8A"/>
  <rect x="19" y="23" width="2" height="3" fill="#2E5C8A"/>
</svg>
