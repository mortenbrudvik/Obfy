<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Obfy</title>
<style>
  :root { color-scheme: light dark; font-family: "Segoe UI", sans-serif; }
  body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: Canvas; color: CanvasText; }
  main { text-align: center; }
  small { opacity: .6; }
</style>
</head>
<body>
<main>
  <h1>Obfy</h1>
  <p id="version">Waiting for the host&hellip;</p>
  <p id="event"><small>No events yet.</small></p>
  <small>Placeholder page: replaced by the real frontend build.</small>
</main>
<script>
  // window.chrome.webview.hostObjects.apibridge.InvokeMethod(service, method, jsonParams) -> JSON string.
  const bridge = window.chrome?.webview?.hostObjects?.apibridge;
  window.chrome?.webview?.addEventListener('message', e => {
    document.getElementById('event').textContent = 'Event: ' + JSON.stringify(e.data);
  });
  async function call(service, method, params) {
    return JSON.parse(await bridge.InvokeMethod(service, method, JSON.stringify(params ?? {})));
  }
  (async () => {
    if (!bridge) { document.getElementById('version').textContent = 'No host bridge.'; return; }
    const info = await call('app', 'info');
    document.getElementById('version').textContent = info.success ? 'Version ' + info.data.version : 'Error: ' + info.error.message;
    await call('app', 'ready');
  })();
</script>
</body>
</html>
